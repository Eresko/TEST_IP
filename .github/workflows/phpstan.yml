name: PHPStan Core

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  phpstan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, redis, pdo_mysql
          coverage: none

      - name: Install Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
        env:
          REDIS_CLIENT: mock
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.php

      - name: Run PHPStan on Changed Files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          vendor/bin/phpstan analyse --level=6 ${{ steps.changed-files.outputs.all_changed_files }} --error-format=github

  tests:
    runs-on: ubuntu-latest

    services:
      # Сервер базы данных (оставляем тот, что вы выбрали, например postgres)
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ak_techlogistic_laravel
          POSTGRES_USER: laravel
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U laravel -d ak_techlogistic_laravel" --health-interval=10s --health-timeout=5s --health-retries=3

      # 👇 ДОБАВЛЯЕМ НАСТОЯЩИЙ REDIS СЮДА
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, redis, pdo, pdo_mysql, bcmath
          coverage: none

      # ... ваши промежуточные шаги (copy env, composer install, key:generate, migrate) ...

      - name: Run Feature Tests
        env:
          # Конфигурация вашей БД (укажите вашу актуальную, здесь для примера pgsql)
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ak_techlogistic_laravel
          DB_USERNAME: laravel
          DB_PASSWORD: password

          # 👇 ОЖИВЛЯЕМ REDIS ДЛЯ ТЕСТОВ
          REDIS_CLIENT: phpredis      # Используем стандартный рабочий клиент вместо mock
          REDIS_HOST: 127.0.0.1      # Подключаемся к поднятому выше сервису
          REDIS_PORT: 6379
          CACHE_STORE: redis         # Или используйте тот store, который вызывает контроллер
          CACHE_DRIVER: redis

          SCOUT_DRIVER: collection
        run: vendor/bin/phpunit --testsuite=Feature