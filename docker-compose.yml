version: '3.8'

services:
  smart_logistic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_logistic_php
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: smart_logistic_postgres
      DB_PORT: 5432
      DB_DATABASE: smart_logistic_laravel
      DB_USERNAME: laravel
      DB_PASSWORD: password
      QUEUE_CONNECTION: rabbitmq
      CACHE_STORE: redis
      RABBITMQ_HOST: smart_logistic_rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      REDIS_HOST: smart_logistic_redis
    volumes:
      - .:/var/www/html
    networks:
      - smart_logistic_net
    depends_on:
      - smart_logistic_postgres
      - smart_logistic_rabbitmq
      - smart_logistic_redis

  smart_logistic_nginx:
    image: nginx:alpine
    container_name: smart_logistic_nginx_server
    restart: unless-stopped
    ports:
      - "8202:80"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - smart_logistic
    networks:
      - smart_logistic_net

  smart_logistic_queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_logistic_queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work rabbitmq --queue=high,default --sleep=3 --tries=3 --timeout=90
    # env_file НЕ используется. Все настройки заданы ниже:
    environment:
      # Окружение Laravel
      APP_NAME: Laravel
      APP_ENV: local
      APP_KEY: base64:n6ZKLcXgOg4/7CrrgnGdi0C2cJjKOw7cr0ZMrsRcvZE=
      APP_DEBUG: "true"

      # Настройки Базы Данных Postgres
      DB_CONNECTION: pgsql
      DB_HOST: smart_logistic_postgres
      DB_PORT: 5432
      DB_DATABASE: smart_logistic_laravel
      DB_USERNAME: laravel
      DB_PASSWORD: password

      # Настройки Очередей RabbitMQ
      QUEUE_CONNECTION: rabbitmq
      RABBITMQ_HOST: smart_logistic_rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest

      # Системные драйверы
      LOG_CHANNEL: stack
      CACHE_STORE: file
      SESSION_DRIVER: array
    volumes:
      - .:/var/www/html
    depends_on:
      - smart_logistic
      - smart_logistic_postgres
      - smart_logistic_rabbitmq
    networks:
      - smart_logistic_net

  smart_logistic_postgres:
    image: postgres:14
    container_name: smart_logistic_postgres_db
    environment:
      POSTGRES_DB: smart_logistic_laravel
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: password
    ports:
      - '5480:5432'
    volumes:
      - smart_logistic_pgdata:/var/lib/postgresql/data
    networks:
      - smart_logistic_net

  smart_logistic_rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: smart_logistic_rabbitmq_server
    restart: unless-stopped
    ports:
      - "5673:5672"
      - "15673:15672"
    networks:
      - smart_logistic_net

  smart_logistic_redis:
    image: redis:alpine
    container_name: smart_logistic_redis_server
    restart: unless-stopped
    networks:
      - smart_logistic_net

volumes:
  smart_logistic_pgdata:

networks:
  smart_logistic_net:
    driver: bridge
